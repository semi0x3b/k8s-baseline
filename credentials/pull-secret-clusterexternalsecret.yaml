# 레지스트리 pull secret 을 여러 namespace 에 자동 배포하는 패턴.
# namespace 에 라벨(registry-pull: enabled)만 붙이면 Secret 이 따라온다 —
# 새 namespace 마다 pull secret 을 손으로 만드는 일이 사라진다.
apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: registry-pull
spec:
  externalSecretName: registry-pull
  namespaceSelector:
    matchLabels:
      registry-pull: enabled
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault
    target:
      name: registry-credentials
      template:
        type: kubernetes.io/dockerconfigjson
    data:
      - secretKey: .dockerconfigjson
        remoteRef:
          key: registry-pull-dockerconfigjson
