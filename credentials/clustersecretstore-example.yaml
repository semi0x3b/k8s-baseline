# ClusterSecretStore — 클러스터 전체가 공유하는 Vault 접점.
# 예시는 OCI Vault. AWS/GCP/HashiCorp Vault 는 provider 블록만 다르다.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    oracle:
      region: <region>
      vault: <vault-ocid>
      compartment: <compartment-ocid>
      auth:
        # 워크로드 아이덴티티(권장) 또는 user principal
        # 노드/워크로드에 read secret-family 권한을 IAM policy 로 부여
        workloadIdentity: {}
